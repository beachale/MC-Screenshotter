plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

tasks.register('imageCompressionTest', JavaExec) {
    group = 'verification'
    description = 'Verifies JPEG compression output, amount behavior, decoding, and MIME detection.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.panshot.spectatorcam.ImageEncoderSelfTest')
}

tasks.register('videoCompressionTest', JavaExec) {
    group = 'verification'
    description = 'Verifies video-style compression strength, temporal state, and frame output.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.panshot.spectatorcam.VideoCompressionFilterSelfTest')
}

tasks.register('panoramaFollowTest', JavaExec) {
    group = 'verification'
    description = 'Verifies panorama player-follow yaw, pitch, wrapping, and JSON output.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('com.panshot.spectatorcam.PanoramaFollowTargetSelfTest')
}

tasks.named('check') {
    dependsOn imageCompressionTest
    dependsOn videoCompressionTest
    dependsOn panoramaFollowTest
}

def githubRepository = System.getenv('GITHUB_REPOSITORY')

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'PanShot'
                description = 'A client-side Fabric camera and screenshot recreation mod.'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/license/mit/'
                        distribution = 'repo'
                    }
                }
            }
        }
    }

    repositories {
        if (githubRepository) {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${githubRepository}")
                credentials {
                    username = System.getenv('USERNAME')
                    password = System.getenv('TOKEN')
                }
            }
        }
    }
}
